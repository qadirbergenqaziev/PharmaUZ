<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dorixona kirishi — PharmaUZ</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>


<body>

<header class="header">

    <div class="container">

        <div class="logo">
            💊 PharmaUZ
        </div>

        <div class="location">
            🏥 Dorixona kabineti
        </div>

    </div>

</header>


<main>

<section class="features">

<div class="container">


    <div class="feature-card"
         style="
         max-width:500px;
         margin:50px auto;
         ">

        <div style="
            font-size:60px;
            margin-bottom:15px;
        ">
            🏥
        </div>


        <h1 style="margin-bottom:10px;">
            Dorixona kabineti
        </h1>


        <p style="
            color:#666;
            margin-bottom:30px;
        ">
            PharmaUZ tizimiga kirish
        </p>


        {% if error %}

        <div style="
            background:#f8d7da;
            color:#842029;
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
        ">
            ⚠️ {{ error }}
        </div>

        {% endif %}


        <form action="/login"
              method="post"
              style="text-align:left;">


            <label>
                Telefon yoki login
            </label>

            <input
                type="text"
                name="username"
                placeholder="Loginni kiriting"
                required
                style="
                width:100%;
                padding:14px;
                margin:8px 0 20px;
                border:1px solid #ddd;
                border-radius:8px;
                font-size:16px;
                ">


            <label>
                Parol
            </label>

            <input
                type="password"
                name="password"
                placeholder="Parolni kiriting"
                required
                style="
                width:100%;
                padding:14px;
                margin:8px 0 25px;
                border:1px solid #ddd;
                border-radius:8px;
                font-size:16px;
                ">


            <button
                type="submit"
                style="
                width:100%;
                padding:14px;
                border:none;
                background:#087f5b;
                color:white;
                border-radius:8px;
                font-size:17px;
                cursor:pointer;
                ">

                🔐 Tizimga kirish

            </button>

        </form>


        <div style="
            margin-top:25px;
            padding:15px;
            background:#f4f7fb;
            border-radius:8px;
            text-align:left;
            font-size:14px;
        ">

            <b>Demo hisob:</b>

            <br><br>

            Login:
            <b>salomat</b>

            <br>

            Parol:
            <b>12345</b>

        </div>


    </div>

</div>

</section>

</main>


<footer>

    <p>
        © 2026 PharmaUZ.
        Kerakli dori — kerakli joyda.
    </p>

</footer>


</body>

</html>
